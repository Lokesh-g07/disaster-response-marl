# Multi-Scenario MAPPO Training Configuration

env:
  train_scenarios:
    - "simulation/scenarios/examples/fire_small.json"
    - "simulation/scenarios/examples/flood_small.json"
  train_seeds: [42, 14, 25, 7]
  eval_seeds: [19, 31, 55, 99]
  max_agents: 2

training:
  num_episodes: 500
  num_steps: 50  # Steps per episode rollout
  actor_lr: 3.0e-4
  critic_lr: 1.0e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  ppo_epoch: 10
  num_mini_batch: 2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  device: "cpu" # Change to "cuda" if available

evaluation:
  eval_interval: 50
  eval_episodes: 2

logging:
  save_dir: "./checkpoints/mappo_multiscenario"
  save_interval: 100
